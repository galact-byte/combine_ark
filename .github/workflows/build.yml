name: Build Windows EXE

# 推送形如 v1.0.0 的 tag 时触发：打包单文件 exe 并发布到 GitHub Release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 打包 exe
        run: pyinstaller --onefile --noconsole --name ArkPixelHelper main.py

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ArkPixelHelper.exe
          generate_release_notes: true
